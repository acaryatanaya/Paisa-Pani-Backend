
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Paisa-Pani backend - initial health API

Parameters:
  LambdaExecutionRoleArn:
    Type: String
    Description: ARN of the existing paisa-pani-lambda-execution-role

Resources:
  PaisaPaniHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_waru5q9eZ
              audience:
                - 1ucr4810a49r6db220bhkc519r
      CorsConfiguration:
        AllowOrigins:
          - https://expense.sandboxtejas.in
          - http://localhost:5173
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        MaxAge: 600

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: paisa-pani-health
      CodeUri: .
      Runtime: nodejs22.x
      Handler: src/handlers/health.handler
      Role: !Ref LambdaExecutionRoleArn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          DB_SECRET_ARN: arn:aws:secretsmanager:ap-south-1:964222105287:secret:expense-tracker/prod/db-FyTBtS
      VpcConfig:
        SubnetIds:
          - subnet-07b86a9004f5845f8
          - subnet-0c8d0a85cfc5ea54e
        SecurityGroupIds:
          - sg-09d14e1b090db41fc
      Events:
        HealthRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref PaisaPaniHttpApi
            Path: /health
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/health.ts
        Minify: true
        Target: es2022
        Sourcemap: true

  DatabaseHealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: paisa-pani-db-health
      CodeUri: .
      Runtime: nodejs22.x
      Handler: src/handlers/db-health.handler
      Role: !Ref LambdaExecutionRoleArn
      Timeout: 10
      MemorySize: 256
      VpcConfig:
        SubnetIds:
          - subnet-07b86a9004f5845f8
          - subnet-0c8d0a85cfc5ea54e
        SecurityGroupIds:
          - sg-09d14e1b090db41fc
      Environment:
        Variables:
          DB_SECRET_ARN: arn:aws:secretsmanager:ap-south-1:964222105287:secret:expense-tracker/prod/db-FyTBtS
      Events:
        DatabaseHealthRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref PaisaPaniHttpApi
            Path: /health/db
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/db-health.ts
        Minify: true
        Target: es2022
        Sourcemap: true

  CategoriesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: paisa-pani-categories
      CodeUri: .
      Runtime: nodejs22.x
      Handler: src/handlers/categories.handler
      Role: !Ref LambdaExecutionRoleArn
      Timeout: 10
      MemorySize: 256
      VpcConfig:
        SubnetIds:
          - subnet-07b86a9004f5845f8
          - subnet-0c8d0a85cfc5ea54e
        SecurityGroupIds:
          - sg-09d14e1b090db41fc
      Environment:
        Variables:
          DB_SECRET_ARN: arn:aws:secretsmanager:ap-south-1:964222105287:secret:expense-tracker/prod/db-FyTBtS
      Events:
        CategoriesRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref PaisaPaniHttpApi
            Path: /categories
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/categories.ts
        Minify: true
        Target: es2022
        Sourcemap: true

  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: paisa-pani-me
      CodeUri: .
      Runtime: nodejs22.x
      Handler: src/handlers/me.handler
      Role: !Ref LambdaExecutionRoleArn
      Timeout: 10
      MemorySize: 256
      VpcConfig:
        SubnetIds:
          - subnet-07b86a9004f5845f8
          - subnet-0c8d0a85cfc5ea54e
        SecurityGroupIds:
          - sg-09d14e1b090db41fc
      Environment:
        Variables:
          DB_SECRET_ARN: arn:aws:secretsmanager:ap-south-1:964222105287:secret:expense-tracker/prod/db-FyTBtS
      Events:
        MeRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref PaisaPaniHttpApi
            Path: /me
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/me.ts
        Minify: true
        Target: es2022
        Sourcemap: true

  UpdateMeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: paisa-pani-update-me
      CodeUri: .
      Runtime: nodejs22.x
      Handler: src/handlers/update-me.handler
      Role: !Ref LambdaExecutionRoleArn
      Timeout: 10
      MemorySize: 256
      VpcConfig:
        SubnetIds:
          - subnet-07b86a9004f5845f8
          - subnet-0c8d0a85cfc5ea54e
        SecurityGroupIds:
          - sg-09d14e1b090db41fc
      Environment:
        Variables:
          DB_SECRET_ARN: arn:aws:secretsmanager:ap-south-1:964222105287:secret:expense-tracker/prod/db-FyTBtS
      Events:
        UpdateMeRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref PaisaPaniHttpApi
            Path: /me
            Method: PATCH
            Auth:
              Authorizer: CognitoJwtAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/update-me.ts
        Minify: true
        Target: es2022
        Sourcemap: true

        
  CreateExpenseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: paisa-pani-create-expense
      CodeUri: .
      Runtime: nodejs22.x
      Handler: src/handlers/create-expense.handler
      Role: !Ref LambdaExecutionRoleArn
      Timeout: 10
      MemorySize: 256
      VpcConfig:
        SubnetIds:
          - subnet-07b86a9004f5845f8
          - subnet-0c8d0a85cfc5ea54e
        SecurityGroupIds:
          - sg-09d14e1b090db41fc
      Environment:
        Variables:
          DB_SECRET_ARN: arn:aws:secretsmanager:ap-south-1:964222105287:secret:expense-tracker/prod/db-FyTBtS
      Events:
        CreateExpenseRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref PaisaPaniHttpApi
            Path: /expenses
            Method: POST
            Auth:
              Authorizer: CognitoJwtAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/create-expense.ts
        Minify: true
        Target: es2022
        Sourcemap: true

  ListExpensesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: paisa-pani-list-expenses
      CodeUri: .
      Runtime: nodejs22.x
      Handler: src/handlers/list-expenses.handler
      Role: !Ref LambdaExecutionRoleArn
      Timeout: 10
      MemorySize: 256
      VpcConfig:
        SubnetIds:
          - subnet-07b86a9004f5845f8
          - subnet-0c8d0a85cfc5ea54e
        SecurityGroupIds:
          - sg-09d14e1b090db41fc
      Environment:
        Variables:
          DB_SECRET_ARN: arn:aws:secretsmanager:ap-south-1:964222105287:secret:expense-tracker/prod/db-FyTBtS
      Events:
        ListExpensesRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref PaisaPaniHttpApi
            Path: /expenses
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/list-expenses.ts
        Minify: true
        Target: es2022
        Sourcemap: true


Outputs:
  ApiUrl:
    Description: Base URL for the Paisa-Pani HTTP API
    Value: !Sub 'https://${PaisaPaniHttpApi}.execute-api.${AWS::Region}.amazonaws.com'

  HealthEndpoint:
    Description: Health endpoint URL
    Value: !Sub 'https://${PaisaPaniHttpApi}.execute-api.${AWS::Region}.amazonaws.com/health'

  HealthFunctionName:
    Description: Deployed health Lambda function name
    Value: !Ref HealthFunction
